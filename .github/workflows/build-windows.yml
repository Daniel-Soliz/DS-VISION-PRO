name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build DS VISION PRO
        run: python -m PyInstaller --noconfirm --onefile --windowed --collect-all customtkinter --name DS_VISION_PRO app.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DS-VISION-PRO-Windows
          path: dist/DS_VISION_PRO.exe
          if-no-files-found: error
          retention-days: 30
