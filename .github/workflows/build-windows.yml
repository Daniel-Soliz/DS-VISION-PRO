name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build DS VISION PRO (onedir)
        run: python -m PyInstaller --noconfirm --onedir --windowed --collect-all customtkinter --name DS_VISION_PRO app.py

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          Get-FileHash dist/DS_VISION_PRO/DS_VISION_PRO.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  DS_VISION_PRO.exe" } |
            Out-File -Encoding ascii dist/DS_VISION_PRO/SHA256SUM.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DS-VISION-PRO-Windows
          path: dist/DS_VISION_PRO/
          if-no-files-found: error
          retention-days: 30
